[project]
name = "wahaty"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "accounts",
    "core",
    "config",
    "oases",
    "farms",
    "finance",
    "inventory",
    "customers",
    "orders",
    "invoices",
    "market",
    "audit",
    "dashboard",
]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
