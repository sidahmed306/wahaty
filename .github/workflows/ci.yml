# Tests automatiques à chaque envoi de code sur GitHub (backend + site).
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trc
          POSTGRES_PASSWORD: trc
          POSTGRES_DB: trc_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valeurs de test uniquement (aucun vrai secret : la base est jetable).
      SECRET_KEY: cle-de-test-uniquement-pour-github-actions
      DEBUG: "False"
      DATABASE_URL: postgres://trc:trc@localhost:5432/trc_tests
      TEST_DATABASE_URL: postgres://trc:trc@localhost:5432/trc_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Style du code (ruff)
        run: ruff check . && ruff format --check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Tests + couverture (au moins 80 %)
        run: pytest --cov --cov-report=term

  frontend:
    name: Site (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run --coverage --coverage.thresholds.lines=80
      - run: npm run build
